schema_version: 1.0.0
schema_name: RaahiSense Scenario Schema
description: 'Reproducible scenario specification for generating complete temporal
  vehicle-intelligence sessions. Each scenario defines its environment, road, traffic,
  ego vehicle, road users, signals, events, contexts, faults, noise conditions, and
  hidden ground truth.

  '
generator:
  generator_name: RaahiSense Synthetic Scenario Generator
  generator_version: 1.0.0
  reproducibility:
    seed_required: true
    deterministic: true
    same_seed_same_scenario: true
  output:
    session_required: true
    data_origin: synthetic
    timestamp_unit: ms
    timestamp_reference: unix_epoch_ms
scenario_structure:
  required:
  - scenario_id
  - scenario_family
  - seed
  - duration_seconds
  - environment
  - road
  - traffic
  - ego_vehicle
  - signals
  - events
  - contexts
  - faults
  - noise
  - ground_truth
  optional:
  - road_users
  - description
  - metadata
scenario_families:
  S01:
    scenario_family: NORMAL_CITY
    description: Normal city driving
  S02:
    scenario_family: HIGHWAY
    description: Highway driving
  S03:
    scenario_family: STOP_AND_GO
    description: Stop-and-go traffic
  S04:
    scenario_family: PEDESTRIAN_CROSSING
    description: Pedestrian crossing scenario
  S05:
    scenario_family: VEHICLE_CUT_IN
    description: Vehicle cut-in scenario
  S06:
    scenario_family: DENSE_TRAFFIC
    description: Dense traffic scenario
  S07:
    scenario_family: BATTERY_TEMPERATURE
    description: Battery temperature increase scenario
  S08:
    scenario_family: SENSOR_ANOMALY
    description: Sensor anomaly scenario
  S09:
    scenario_family: COMMUNICATION_ERROR
    description: Communication error scenario
  S10:
    scenario_family: ADAS_DISENGAGEMENT
    description: ADAS disengagement scenario
scenario:
  scenario_id:
    type: string
    required: true
    pattern: ^[a-z0-9_]+$
  scenario_family:
    type: enum
    required: true
    values:
    - NORMAL_CITY
    - HIGHWAY
    - STOP_AND_GO
    - PEDESTRIAN_CROSSING
    - VEHICLE_CUT_IN
    - DENSE_TRAFFIC
    - BATTERY_TEMPERATURE
    - SENSOR_ANOMALY
    - COMMUNICATION_ERROR
    - ADAS_DISENGAGEMENT
  seed:
    type: integer
    required: true
  duration_seconds:
    type: number
    required: true