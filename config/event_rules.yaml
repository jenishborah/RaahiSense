schema_version: "1.0.0"

dictionary_name: "RaahiSense Event Rules"
description: >
  Configurable event definitions for temporal vehicle-intelligence
  experiments. Rules convert normalized observations and contextual
  information into structured events.

global:
  timestamp_unit: "ms"

  detection:
    minimum_confidence: 0.70
    default_window_ms: 1000

  temporal_policy:
    causal_inference_enabled: false
    causal_claim_allowed_default: false
    temporal_association_is_not_causation: true

  provenance:
    allowed_data_origins:
      - synthetic
      - simulation
      - replay
      - physical

  evaluation:
    ground_truth_hidden_from_retrieval: true
    split_unit: "scenario_or_session"
    configurable_thresholds: true


events:

  # ---------------------------------------------------------
  # 1. SHARP BRAKING
  # ---------------------------------------------------------
  - event_type: "SHARP_BRAKING"
    event_category: "driving"

    description: >
      Detects a rapid vehicle deceleration event using normalized
      vehicle acceleration and braking-related observations.

    detection_method: "rule"
    detection_version: "1.0.0"

    required_signals:
      - "vehicle_acceleration"

    supporting_signals:
      - "vehicle_speed"
      - "brake_pressure"
      - "emergency_braking_active"

    rule:
      type: "threshold_with_duration"

      conditions:
        - signal: "vehicle_acceleration"
          operator: "<="
          value: -4.0
          unit: "m/s2"

      duration:
        minimum_ms: 200
        maximum_ms: 5000

    severity:
      type: "threshold"
      levels:
        low:
          acceleration_greater_than: -4.0
        medium:
          acceleration_less_or_equal: -4.0
          acceleration_greater_than: -6.0
        high:
          acceleration_less_or_equal: -6.0

    event_window:
      pre_event_ms: 2000
      post_event_ms: 3000

    confidence:
      base: 0.90
      supporting_signal_bonus:
        brake_pressure: 0.05
        emergency_braking_active: 0.05

    ground_truth:
      supported: true

    causal_claim_allowed: false


  # ---------------------------------------------------------
  # 2. PEDESTRIAN DETECTED
  # ---------------------------------------------------------
  - event_type: "PEDESTRIAN_DETECTED"
    event_category: "road_user"

    description: >
      Represents detection of a pedestrian in the vehicle scene.

    detection_method: "rule"
    detection_version: "1.0.0"

    required_signals:
      - "pedestrian_detected"

    supporting_signals:
      - "pedestrian_distance"

    rule:
      type: "boolean_state"

      conditions:
        - signal: "pedestrian_detected"
          operator: "=="
          value: true

    event_window:
      pre_event_ms: 1000
      post_event_ms: 2000

    confidence:
      base: 0.90

    ground_truth:
      supported: true

    causal_claim_allowed: false


  # ---------------------------------------------------------
  # 3. VEHICLE DETECTED
  # ---------------------------------------------------------
  - event_type: "VEHICLE_DETECTED"
    event_category: "road_user"

    description: >
      Represents detection of another vehicle in the surrounding scene.

    detection_method: "rule"
    detection_version: "1.0.0"

    required_signals:
      - "vehicle_detected"

    supporting_signals:
      - "vehicle_distance"

    rule:
      type: "boolean_state"

      conditions:
        - signal: "vehicle_detected"
          operator: "=="
          value: true

    event_window:
      pre_event_ms: 1000
      post_event_ms: 2000

    confidence:
      base: 0.90

    ground_truth:
      supported: true

    causal_claim_allowed: false


  # ---------------------------------------------------------
  # 4. COLLISION WARNING
  # ---------------------------------------------------------
  - event_type: "COLLISION_WARNING"
    event_category: "adas"

    description: >
      Represents a collision-related warning generated by the ADAS
      or derived event-detection layer.

    detection_method: "rule"
    detection_version: "1.0.0"

    required_signals:
      - "collision_warning"

    supporting_signals:
      - "vehicle_distance"
      - "pedestrian_distance"
      - "vehicle_speed"

    rule:
      type: "boolean_state"

      conditions:
        - signal: "collision_warning"
          operator: "=="
          value: true

    event_window:
      pre_event_ms: 2000
      post_event_ms: 3000

    confidence:
      base: 0.90

    ground_truth:
      supported: true

    causal_claim_allowed: false


  # ---------------------------------------------------------
  # 5. LANE DEPARTURE WARNING
  # ---------------------------------------------------------
  - event_type: "LANE_DEPARTURE_WARNING"
    event_category: "adas"

    description: >
      Represents a lane-departure warning generated by the ADAS
      or simulation environment.

    detection_method: "rule"
    detection_version: "1.0.0"

    required_signals:
      - "lane_departure_warning"

    rule:
      type: "boolean_state"

      conditions:
        - signal: "lane_departure_warning"
          operator: "=="
          value: true

    event_window:
      pre_event_ms: 2000
      post_event_ms: 3000

    confidence:
      base: 0.90

    ground_truth:
      supported: true

    causal_claim_allowed: false


  # ---------------------------------------------------------
  # 6. EMERGENCY BRAKING
  # ---------------------------------------------------------
  - event_type: "EMERGENCY_BRAKING"
    event_category: "adas"

    description: >
      Represents an active emergency-braking intervention.

    detection_method: "rule"
    detection_version: "1.0.0"

    required_signals:
      - "emergency_braking_active"

    supporting_signals:
      - "vehicle_acceleration"
      - "brake_pressure"
      - "vehicle_speed"

    rule:
      type: "boolean_state"

      conditions:
        - signal: "emergency_braking_active"
          operator: "=="
          value: true

    event_window:
      pre_event_ms: 2000
      post_event_ms: 3000

    confidence:
      base: 0.95

    ground_truth:
      supported: true

    causal_claim_allowed: false


# -----------------------------------------------------------
# TEMPORAL RELATIONSHIP RULES
# -----------------------------------------------------------
relationships:

  allowed_types:
    - "PRECEDES"
    - "FOLLOWS"
    - "OVERLAPS"
    - "CO_OCCURS"
    - "WITHIN_WINDOW"
    - "ASSOCIATED_WITH"

  prohibited_types:
    - "CAUSES"

  defaults:
    temporal_window_ms: 10000
    causal_claim_allowed: false

  examples:

    - source_event: "PEDESTRIAN_DETECTED"
      target_event: "SHARP_BRAKING"
      relationship: "PRECEDES"
      maximum_time_delta_ms: 10000
      causal_claim_allowed: false

    - source_event: "VEHICLE_DETECTED"
      target_event: "SHARP_BRAKING"
      relationship: "WITHIN_WINDOW"
      maximum_time_delta_ms: 10000
      causal_claim_allowed: false

    - source_event: "SHARP_BRAKING"
      target_event: "EMERGENCY_BRAKING"
      relationship: "CO_OCCURS"
      maximum_time_delta_ms: 2000
      causal_claim_allowed: false


# -----------------------------------------------------------
# INSUFFICIENT-EVIDENCE POLICY
# -----------------------------------------------------------
insufficient_evidence:

  enabled: true

  minimum_required_signals:
    SHARP_BRAKING:
      - "vehicle_acceleration"

    PEDESTRIAN_DETECTED:
      - "pedestrian_detected"

    VEHICLE_DETECTED:
      - "vehicle_detected"

    COLLISION_WARNING:
      - "collision_warning"

    LANE_DEPARTURE_WARNING:
      - "lane_departure_warning"

    EMERGENCY_BRAKING:
      - "emergency_braking_active"

  missing_signal_policy: "abstain"

  low_confidence_policy:
    threshold: 0.50
    action: "abstain"


# -----------------------------------------------------------
# ROBUSTNESS / DATA QUALITY
# -----------------------------------------------------------
robustness:

  missing_data:
    supported: true
    test_levels:
      - 0.01
      - 0.05
      - 0.10
      - 0.20

  timestamp_jitter:
    supported: true
    test_levels_ms:
      - 50
      - 100
      - 500

  source_delay:
    supported: true

  conflicting_evidence:
    supported: true

  outlier_observations:
    supported: true


# -----------------------------------------------------------
# RESEARCH REPORTING
# -----------------------------------------------------------
reporting:

  record_thresholds_used: true
  record_detection_version: true
  record_data_origin: true
  record_ground_truth_status: true
  report_precision_recall_f1: true
  report_abstention_rate: true

  language_policy:
    prohibit_unsupported_causal_language: true
    describe_temporal_association_as_association: true